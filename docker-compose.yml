# Lokale Infrastruktur für die Verarbeitung.
# Autor: Rustam T.
#
# Bewusst nur zwei Dienste für den Anfang. Spark kommt in Phase 5 dazu, wenn
# das Archiv so groß ist, dass Pandas nicht mehr reicht. Einen Scheduler-
# Container gibt es nicht, weil das Sammeln in GitHub Actions läuft und nicht
# davon abhängen soll, ob bei mir gerade Docker läuft.
#
# Beide Ports binde ich an 127.0.0.1. Ohne diese Angabe wären die Datenbanken
# im ganzen Heimnetz erreichbar, und das brauche ich für ein lokales Projekt nicht.
#
# Postgres liegt nach außen auf 5433, nicht 5432. Unter Windows ist 5432 oft
# gesperrt, weil Hyper-V den Bereich reserviert oder schon ein lokaler Postgres
# läuft. Innen bleibt der Container bei 5432, Verbindungen aus dem Container
# ändern sich also nicht.
#
# Achtung: "docker compose down -v" löscht die Volumes. Für MongoDB ist das
# kein Verlust, die Landing Zone lässt sich aus Releases und Register neu laden.

services:
  postgres:
    image: postgres:17
    container_name: kvv_postgres
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  mongo:
    image: mongo:7
    container_name: kvv_mongo
    env_file: .env
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      # ping geht auch ohne Anmeldung und sagt mir nur, ob der Server antwortet.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 5

volumes:
  pgdata:
  mongodata:
