# Lokale Infrastruktur für die Verarbeitung.
# Autor: Rustam T.
#
# Zwei Dienste laufen dauerhaft (Postgres, MongoDB). Spark kam in Phase 5 dazu,
# aber nur als Werkzeug zum Aufrufen: Der Dienst steht im Profil "spark" und
# startet deshalb nicht bei "docker compose up -d" mit. Er läuft nur mit
# "docker compose run --rm spark ..." und ist danach wieder weg. Einen Scheduler-
# Container gibt es nicht, weil das Sammeln in GitHub Actions läuft und nicht
# davon abhängen soll, ob bei mir gerade Docker läuft.
#
# Beide Ports binde ich an 127.0.0.1. Ohne diese Angabe wären die Datenbanken
# im ganzen Heimnetz erreichbar, und das brauche ich für ein lokales Projekt nicht.
#
# Postgres liegt nach außen auf 5433, nicht 5432. Unter Windows ist 5432 oft
# gesperrt, weil Hyper-V den Bereich reserviert oder schon ein lokaler Postgres
# läuft. Innen bleibt der Container bei 5432, Verbindungen aus dem Container
# ändern sich also nicht.
#
# Achtung: "docker compose down -v" löscht die Volumes. Für MongoDB ist das
# kein Verlust, die Landing Zone lässt sich aus Releases und Register neu laden.

services:
  postgres:
    image: postgres:17
    container_name: kvv_postgres
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  mongo:
    image: mongo:7
    container_name: kvv_mongo
    env_file: .env
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      # ping geht auch ohne Anmeldung und sagt mir nur, ob der Server antwortet.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 5

  # Spark im lokalen Modus (Phase 5, E18). Das Image baue ich selbst auf dem
  # offiziellen apache/spark auf, siehe spark/Dockerfile. Der ganze Projektordner
  # wird eingehängt, damit die Jobs data/raw lesen und data/parquet schreiben.
  # Postgres erreicht der Container über den Dienstnamen und den inneren Port
  # 5432, nicht über 127.0.0.1:5433 wie vom Windows-Rechner aus.
  spark:
    build: ./spark
    image: kvv-spark:4.2.1
    profiles: ["spark"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - ./:/opt/kvv
    working_dir: /opt/kvv
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mongodata:
